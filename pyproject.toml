[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "phasma-review-audit"
version = "2.0.0"
description = "Blinded annotation and reproducible analysis of Phasmophobia Steam reviews"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.3.5",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "joblib==1.5.3",
  "openpyxl==3.1.5",
]

[project.scripts]
phasma-review = "phasma_review.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
